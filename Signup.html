<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassIQ</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>

<body>

  <!---header-->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo" src="images/logo.png" id="brandLogo"alt="ClassIQ Logo">
     <span id="course" class="dashboard-link">Courses</span>
      </div>
      <div class="header-buttons">
       <button class="login-btn" id="loginButton">Login</button>
  <button class="signup-btn" id="signupButton">Signup</button>
      </div>
    </div>
  </header>
  <div class="form-wrapper">
  <div class="form-container">
    <h2>SignUp</h2>
    <form class="signupForm3">
      <div class="form-group">
        <input type="email" id="email" name="email" placeholder="Enter Your Email" required>
      </div>
 <div class="form-group">
        <input type="email" id="fullname" name="fullname" placeholder="Enter Your Fullname" required>
      </div>

      <div class="form-group">
        <input type="password" id="password" name="password" placeholder="Enter Your Password" required>
      </div>

      <button type="submit" class="signup-btn2">SignUp</button>

     
      <h4>
      Already have an account? <a href="Login.html"></a>Login</a></h4>
    </form>
  </div>
</div>
 

</body>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

</html>
